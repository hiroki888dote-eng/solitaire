<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <!-- スマホの画面幅に合わせる・拡大縮小をさせない・iPhoneの切り欠きまで使う -->
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
  <!-- ホーム画面に追加したとき、アプリのように全画面で開くための設定 -->
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="ソリティア">
  <meta name="theme-color" content="#121e33">
  <link rel="manifest" href="manifest.webmanifest?v=2">
  <!-- ?v=2 はアイコンの版の番号。アイコンを変えたら数字を上げると、iPhoneが新しい絵を取りに行く -->
  <link rel="apple-touch-icon" href="apple-touch-icon.png?v=2">
  <title>ソリティア</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <!-- 上のバー：タイトル・経過時間・手数 -->
  <header>
    <h1>ソリティア</h1>
    <div class="stats">
      <span id="time">0:00</span>
      <span id="moves">0手</span>
      <span id="target"></span>
    </div>
  </header>

  <!-- ボタンの帯（画面の上の方に置く）
       「戻す」は左、「新しいゲーム」は右。右上の山札をタップするとき、
       指が「戻す」に当たらないようにするため（新しいゲームは確認が出るので安全） -->
  <nav class="toolbar">
    <button id="undoBtn">↶ 戻す</button>
    <button id="newBtn">新しいゲーム</button>
  </nav>

  <!-- ゲーム盤。カードはここに JavaScript で並べる -->
  <main id="board"></main>

  <!-- 解ける配り方を探している間に出すお知らせ -->
  <div id="dealing" hidden>カードを配っています…</div>

  <!-- クリアしたときの画面 -->
  <div id="win" hidden>
    <div class="panel">
      <div class="big">🎉 クリア！</div>
      <p id="winText"></p>
      <button id="againBtn">もう一度あそぶ</button>
    </div>
  </div>

  <script src="js/game.js"></script>
</body>
</html>
